<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial;
      margin: 40px;
    }
    h2 {
      margin-top: 40px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 30px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<h1>Admin Dashboard</h1>

<h2>Blocked Logins (Redis)</h2>
<table>
  <thead>
    <tr>
      <th>Username</th>
      <th>IP</th>
      <th>TTL (seconds)</th>
    </tr>
  </thead>
  <tbody id="blocked-body"></tbody>
</table>

<h2>IPs with Multiple Users (Neo4j)</h2>
<table>
  <thead>
    <tr>
      <th>IP</th>
      <th>Users</th>
      <th>User Count</th>
    </tr>
  </thead>
  <tbody id="ip-users-body"></tbody>
</table>

<h2>Users with Multiple IPs (Neo4j)</h2>
<table>
  <thead>
    <tr>
      <th>Username</th>
      <th>IPs</th>
      <th>IP Count</th>
    </tr>
  </thead>
  <tbody id="user-ips-body"></tbody>
</table>

<h2>Suspicious IPs (Failed Logins)</h2>
<table>
  <thead>
    <tr>
      <th>IP</th>
      <th>Failures</th>
    </tr>
  </thead>
  <tbody id="suspicious-body"></tbody>
</table>

<script src="admin.js"></script>
</body>
</html>
